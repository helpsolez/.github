name: Task
description: One bounded task. Structured intake only — approvals are separate comments posted personally by the Founder.
title: "<TASK-ID>: <short title>"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        This form records what the task is. It does NOT approve anything and does not enforce any gate.
        Approval, merge and deployment decisions are separate comments posted personally by the Founder (a human) on this issue.
        Account identity alone is not authorization: AI-generated comments, labels and checkboxes are never Founder authorization.
        Replace the title placeholder "<TASK-ID>: <short title>" before submitting.
        The checkboxes at the end are manual tracking only; leave them unticked when creating the issue.
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: "e.g. ABC-01"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["security", "backend", "erp", "design", "process"]
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan document and its SHA256
      placeholder: "<plan file name> · SHA256 <64 hex characters>"
    validations:
      required: true
  - type: input
    id: start_commit
    attributes:
      label: Start commit(s), full SHA
      placeholder: "<repo>@<40-character commit SHA>"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope — allowed, and NOT included
    validations:
      required: true
  - type: input
    id: roles
    attributes:
      label: Writer / Reviewer
      placeholder: "Writer: <tool> · Reviewer: <different tool>"
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gate tracking (manual; not proof of anything — the comments and review evidence are the record)
      options:
        - label: Plan reviewed
        - label: Approval comment posted personally by the Founder
        - label: Writer received the approval text verbatim (no placeholder)
        - label: Independent review verdict GREEN
        - label: Merge decision comment posted personally by the Founder
        - label: Deployment decision comment posted personally by the Founder (if applicable)
        - label: Result posted and checked
